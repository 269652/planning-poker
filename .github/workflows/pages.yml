# Tests and builds the static site, then publishes it to the `gh-pages` branch.
# GitHub Pages serves that branch (Settings → Pages → Source: Deploy from a branch → gh-pages, / (root)).
name: Deploy to GitHub Pages

on:
  push:
    # main, plus this repository's current default branch
    branches: [main, claude/quirky-mccarthy-1gg6p9]
  workflow_dispatch:

permissions:
  contents: write # push the built site to gh-pages

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # Served from https://<owner>.github.io/<repository>/
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          # The WebSocket relay on Vercel, e.g. wss://planning-poker-relay.vercel.app/api/relay (repository variable)
          NEXT_PUBLIC_RELAY_URL: ${{ vars.RELAY_URL }}
      - name: Publish to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # .nojekyll: keep GitHub's Jekyll step from hiding the _next/ folder
          touch out/.nojekyll
          cd out
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
